<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easy Têxtil — Login</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<main class="auth-card">
  <div class="brand">Easy Têxtil</div>
  <h1>Entrar</h1><p class="muted">Acesse os dados desta instalação.</p>
  <form id="login">
    <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
    <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
    <button class="button primary full" type="submit">Entrar</button>
  </form>
  <p>Não possui uma conta? <a href="cadastro.html">Cadastre-se</a></p>
  <p id="mensagem" class="message"></p>
</main>
<script src="js/app.js"></script><script src="js/login.js"></script>
</body></html>
