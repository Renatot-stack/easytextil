<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Easy Têxtil - Produto</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px;
            background: #f5f5f5;
            color: #222;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .modelo {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
        }

        .imagem-area {
            text-align: center;
        }

        #area {
            width: 100%;
            height: 250px;

            border: 2px dashed #999;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #fafafa;
            color: #666;
            overflow: hidden;
        }

        #preview {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .tamanho-config {
            margin-top: 25px;
        }

        .options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .options label {
            margin: 0;
            cursor: pointer;
        }

        .options input {
            display: none;
        }

        .options span {
            display: block;
            padding: 10px 18px;

            border: 1px solid #aaa;
            border-radius: 6px;
            background: white;
        }

        .options input:checked + span {
            background: #222;
            color: white;
            border-color: #222;
        }

        .custos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .campo {
            margin-bottom: 5px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .voltar {
            background: white;
            border: 1px solid #bbb;
        }

        #salvar {
            background: #222;
            color: white;
            width: 100%;
        }

        #salvar:hover {
            background: #444;
        }

        #resultado {
            background: #f0f0f0;
            border-radius: 8px;
            padding: 20px;
            line-height: 1.6;
        }

        .valor-final {
            font-size: 24px;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .modelo {
                grid-template-columns: 1fr;
            }

            .custos {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <div>
        <h1 id="titulo">Novo produto</h1>
        <p>Easy Têxtil</p>
    </div>

    <button
        class="voltar"
        onclick="window.location.href='index.html'"
    >
        ← Produtos
    </button>

</header>


<!-- MODELO -->

<section class="card">

    <h2>Informações do modelo</h2>


    <div class="modelo">


        <div>

            <label for="nome">
                Nome da peça:
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Ex.: Camisa básica"
            >


            <div class="tamanho-config">

                <h3>Tamanhos</h3>


                <label for="tipoTamanho">
                    Tipo de tamanho:
                </label>

                <select id="tipoTamanho">

                    <option value="letras">
                        Letras (PP, P, M, G, GG)
                    </option>

                    <option value="numeros">
                        Números
                    </option>

                </select>


                <div
                    class="options"
                    id="opcoesTamanho"
                ></div>

            </div>

        </div>


        <!-- IMAGEM -->

        <div class="imagem-area">

            <div id="area">

                <span>
                    Arraste uma imagem aqui
                    <br>
                    ou clique para escolher
                </span>

            </div>

            <input
                type="file"
                id="inputImagem"
                accept="image/*"
                hidden
            >

        </div>


    </div>

</section>



<!-- PRODUÇÃO -->

<section class="card">

    <h2>Produção</h2>

    <label for="quantidade">
        Quantidade de peças produzidas:
    </label>

    <input
        type="number"
        id="quantidade"
        min="1"
        step="1"
        placeholder="Ex.: 100"
    >

</section>



<!-- CUSTOS -->

<section class="card">

    <h2>Custos da produção</h2>


    <div class="custos">

        <div class="campo">
            <label>Tecido (R$)</label>
            <input type="number" id="tecido" min="0" step="0.01">
        </div>

        <div class="campo">
            <label>Aviamentos (R$)</label>
            <input type="number" id="aviamentos" min="0" step="0.01">
        </div>

        <div class="campo">
            <label>Salários dos funcionários (R$)</label>
            <input type="number" id="salarios" min="0" step="0.01">
        </div>

        <div class="campo">
            <label>Conta de luz (R$)</label>
            <input type="number" id="energia" min="0" step="0.01">
        </div>

        <div class="campo">
            <label>Conta de água (R$)</label>
            <input type="number" id="agua" min="0" step="0.01">
        </div>

        <div class="campo">
            <label>Aluguel (R$)</label>
            <input type="number" id="aluguel" min="0" step="0.01">
        </div>

        <div class="campo">
            <label>Manutenção de máquinas (R$)</label>
            <input type="number" id="manutencao" min="0" step="0.01">
        </div>

        <div class="campo">
            <label>Embalagens (R$)</label>
            <input type="number" id="embalagens" min="0" step="0.01">
        </div>

        <div class="campo">
            <label>Transporte / frete (R$)</label>
            <input type="number" id="transporte" min="0" step="0.01">
        </div>

        <div class="campo">
            <label>Outros custos (R$)</label>
            <input type="number" id="outros" min="0" step="0.01">
        </div>

    </div>


    <br>


    <button id="salvar">
        Salvar produto
    </button>

</section>



<!-- RESULTADO -->

<section class="card">

    <h2>Resultado</h2>

    <div id="resultado">
        Preencha os valores e clique em salvar.
    </div>

</section>



<script>


/* =========================
   CONFIGURAÇÃO
========================= */

const CHAVE = "easyTextilProdutos";

const parametros =
    new URLSearchParams(window.location.search);

const idEdicao =
    parametros.get("id");



/* =========================
   PRODUTOS
========================= */

function obterProdutos() {

    return JSON.parse(
        localStorage.getItem(CHAVE)
    ) || [];

}


function salvarProdutos(produtos) {

    localStorage.setItem(
        CHAVE,
        JSON.stringify(produtos)
    );

}



/* =========================
   TAMANHOS
========================= */

const tipoTamanho =
    document.getElementById("tipoTamanho");

const opcoesTamanho =
    document.getElementById("opcoesTamanho");


function criarOpcoesTamanho(
    tipo,
    selecionados = []
) {

    let tamanhos;


    if (tipo === "letras") {

        tamanhos = [
            "PP",
            "P",
            "M",
            "G",
            "GG"
        ];

    } else {

        tamanhos = [
            "34",
            "36",
            "38",
            "40",
            "42",
            "44",
            "46",
            "48",
            "50",
            "52",
            "54",
            "56",
            "58",
            "60"
        ];

    }


    opcoesTamanho.innerHTML = "";


    tamanhos.forEach(tamanho => {

        const selecionado =
            selecionados.includes(tamanho);


        opcoesTamanho.innerHTML += `

            <label>

                <input
                    type="checkbox"
                    value="${tamanho}"
                    ${selecionado ? "checked" : ""}
                >

                <span>
                    ${tamanho}
                </span>

            </label>

        `;

    });

}


tipoTamanho.addEventListener(
    "change",
    () => {

        criarOpcoesTamanho(
            tipoTamanho.value
        );

    }
);


criarOpcoesTamanho("letras");



/* =========================
   IMAGEM
========================= */

const area =
    document.getElementById("area");

const inputImagem =
    document.getElementById("inputImagem");


area.addEventListener(
    "click",
    () => inputImagem.click()
);


function mostrarImagem(arquivo) {

    if (
        !arquivo ||
        !arquivo.type.startsWith("image/")
    ) {
        return;
    }


    const url =
        URL.createObjectURL(arquivo);


    area.innerHTML = "";


    const imagem =
        document.createElement("img");

    imagem.id = "preview";
    imagem.src = url;
    imagem.alt = "Imagem da peça";


    area.appendChild(imagem);

}


inputImagem.addEventListener(
    "change",
    () => {

        mostrarImagem(
            inputImagem.files[0]
        );

    }
);


area.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

    }
);


area.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        mostrarImagem(
            event.dataTransfer.files[0]
        );

    }
);



/* =========================
   VALORES
========================= */

function valor(id) {

    return Number(
        document.getElementById(id).value
    ) || 0;

}



/* =========================
   CALCULAR
========================= */

function calcular() {

    const quantidade =
        valor("quantidade");


    const resultado =
        document.getElementById("resultado");


    if (quantidade <= 0) {

        resultado.innerHTML =
            "Informe uma quantidade válida.";

        return null;

    }


    const custos = {

        tecido: valor("tecido"),
        aviamentos: valor("aviamentos"),
        salarios: valor("salarios"),
        energia: valor("energia"),
        agua: valor("agua"),
        aluguel: valor("aluguel"),
        manutencao: valor("manutencao"),
        embalagens: valor("embalagens"),
        transporte: valor("transporte"),
        outros: valor("outros")

    };


    const custoTotal =
        Object.values(custos)
            .reduce(
                (total, custo) =>
                    total + custo,
                0
            );


    const custoPorPeca =
        custoTotal / quantidade;


    return {
        quantidade,
        custos,
        custoTotal,
        custoPorPeca
    };

}



/* =========================
   SALVAR
========================= */

document
    .getElementById("salvar")
    .addEventListener(
        "click",
        salvarProduto
    );


function salvarProduto() {

    const calculo =
        calcular();


    if (!calculo) return;


    const nome =
        document.getElementById("nome")
            .value.trim();


    const tamanhos =
        Array.from(
            document.querySelectorAll(
                "#opcoesTamanho input:checked"
            )
        ).map(
            input => input.value
        );


    const produtos =
        obterProdutos();


    if (idEdicao) {

        const indice =
            produtos.findIndex(
                produto =>
                    produto.id === idEdicao
            );


        if (indice === -1) {

            alert(
                "Produto não encontrado."
            );

            return;

        }


        produtos[indice] = {

            ...produtos[indice],

            nome,

            tipoTamanho:
                tipoTamanho.value,

            tamanhos,

            quantidade:
                calculo.quantidade,

            custos:
                calculo.custos,

            custoTotal:
                calculo.custoTotal,

            custoPorPeca:
                calculo.custoPorPeca

        };


    } else {

        const produto = {

            id:
                crypto.randomUUID(),

            nome,

            tipoTamanho:
                tipoTamanho.value,

            tamanhos,

            quantidade:
                calculo.quantidade,

            custos:
                calculo.custos,

            custoTotal:
                calculo.custoTotal,

            custoPorPeca:
                calculo.custoPorPeca,

            criadoEm:
                new Date().toISOString()

        };


        produtos.push(produto);

    }


    salvarProdutos(produtos);


    mostrarResultado(calculo);


    alert(
        idEdicao
            ? "Produto atualizado!"
            : "Produto cadastrado!"
    );

}



/* =========================
   RESULTADO
========================= */

function mostrarResultado(calculo) {

    const nome =
        document.getElementById("nome")
            .value || "Produto sem nome";


    document.getElementById(
        "resultado"
    ).innerHTML = `

        <strong>Peça:</strong>
        ${nome}

        <br>

        <strong>Quantidade:</strong>
        ${calculo.quantidade} peças

        <br><br>

        <strong>Custo total:</strong>
        R$ ${calculo.custoTotal.toFixed(2)}

        <br><br>

        <div class="valor-final">

            VALOR MÍNIMO POR PEÇA:
            R$ ${calculo.custoPorPeca.toFixed(2)}

        </div>

    `;

}



/* =========================
   CARREGAR EDIÇÃO
========================= */

function carregarProduto() {

    if (!idEdicao) return;


    const produtos =
        obterProdutos();


    const produto =
        produtos.find(
            item =>
                item.id === idEdicao
        );


    if (!produto) {

        alert(
            "Produto não encontrado."
        );

        window.location.href =
            "index.html";

        return;

    }


    document.getElementById(
        "titulo"
    ).textContent =
        "Editar produto";


    document.getElementById(
        "nome"
    ).value =
        produto.nome || "";


    document.getElementById(
        "quantidade"
    ).value =
        produto.quantidade || "";


    tipoTamanho.value =
        produto.tipoTamanho || "letras";


    criarOpcoesTamanho(
        tipoTamanho.value,
        produto.tamanhos || []
    );


    Object.entries(
        produto.custos || {}
    ).forEach(
        ([id, valor]) => {

            const campo =
                document.getElementById(id);

            if (campo) {
                campo.value = valor;
            }

        }
    );


    if (produto.custoTotal !== undefined) {

        mostrarResultado({

            quantidade:
                produto.quantidade,

            custoTotal:
                produto.custoTotal,

            custoPorPeca:
                produto.custoPorPeca

        });

    }

}


carregarProduto();

</script>

</body>

</html>
