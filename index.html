<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Easy Têxtil - Produtos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px;
            background: #f5f5f5;
            color: #222;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 16px;
            font-size: 15px;
            cursor: pointer;
        }

        .novo {
            background: #222;
            color: white;
        }

        .novo:hover {
            background: #444;
        }

        .acoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .acoes button {
            background: white;
            border: 1px solid #bbb;
        }

        .produtos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .produto {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .produto:hover {
            transform: translateY(-2px);
            border-color: #888;
        }

        .produto h2 {
            margin-top: 0;
        }

        .tamanhos {
            color: #666;
            margin: 10px 0;
        }

        .preco {
            font-size: 20px;
            font-weight: bold;
        }

        .vazio {
            background: white;
            border: 1px dashed #aaa;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
        }

        @media (max-width: 800px) {
            .produtos {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            body {
                padding: 15px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .produtos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>Easy Têxtil</h1>
            <p>Produtos cadastrados</p>
        </div>

        <button class="novo" onclick="novoProduto()">
            + Novo produto
        </button>
    </header>


    <div class="acoes">

        <button onclick="exportarJSON()">
            Exportar JSON
        </button>

        <button onclick="document.getElementById('arquivoJSON').click()">
            Importar JSON
        </button>

        <input
            type="file"
            id="arquivoJSON"
            accept=".json"
            hidden
        >

    </div>


    <main id="listaProdutos"></main>


    <script>

        const CHAVE = "easyTextilProdutos";


        function obterProdutos() {

            return JSON.parse(
                localStorage.getItem(CHAVE)
            ) || [];

        }


        function salvarProdutos(produtos) {

            localStorage.setItem(
                CHAVE,
                JSON.stringify(produtos)
            );

        }


        function novoProduto() {

            window.location.href = "produto.html";

        }


        function editarProduto(id) {

            window.location.href =
                `produto.html?id=${id}`;

        }


        function formatarMoeda(valor) {

            return Number(valor).toLocaleString(
                "pt-BR",
                {
                    style: "currency",
                    currency: "BRL"
                }
            );

        }


        function carregarProdutos() {

            const produtos = obterProdutos();

            const lista =
                document.getElementById("listaProdutos");


            if (produtos.length === 0) {

                lista.innerHTML = `
                    <div class="vazio">
                        <h2>Nenhum produto cadastrado</h2>

                        <p>
                            Clique em "Novo produto"
                            para cadastrar a primeira peça.
                        </p>
                    </div>
                `;

                return;
            }


            lista.innerHTML = `
                <div class="produtos">

                    ${produtos.map(produto => `

                        <article
                            class="produto"
                            onclick="editarProduto('${produto.id}')"
                        >

                            <h2>
                                ${produto.nome || "Produto sem nome"}
                            </h2>

                            <div class="tamanhos">
                                Tamanhos:
                                ${
                                    produto.tamanhos?.length
                                    ? produto.tamanhos.join(", ")
                                    : "Nenhum"
                                }
                            </div>

                            <p>
                                Produção:
                                ${produto.quantidade} peças
                            </p>

                            <div class="preco">
                                ${formatarMoeda(produto.custoPorPeca)}
                                / peça
                            </div>

                        </article>

                    `).join("")}

                </div>
            `;

        }


        function exportarJSON() {

            const produtos = obterProdutos();

            const dados =
                JSON.stringify(produtos, null, 4);

            const arquivo =
                new Blob(
                    [dados],
                    { type: "application/json" }
                );

            const url =
                URL.createObjectURL(arquivo);

            const link =
                document.createElement("a");

            link.href = url;
            link.download = "easy-textil-produtos.json";

            link.click();

            URL.revokeObjectURL(url);

        }


        document
            .getElementById("arquivoJSON")
            .addEventListener("change", function () {

                const arquivo = this.files[0];

                if (!arquivo) return;


                const leitor = new FileReader();


                leitor.onload = function (event) {

                    try {

                        const produtos =
                            JSON.parse(event.target.result);


                        if (!Array.isArray(produtos)) {
                            throw new Error();
                        }


                        salvarProdutos(produtos);

                        carregarProdutos();

                        alert(
                            "Produtos importados com sucesso!"
                        );

                    } catch {

                        alert(
                            "O arquivo JSON não é válido."
                        );

                    }

                };


                leitor.readAsText(arquivo);

            });


        carregarProdutos();

    </script>

</body>

</html>
