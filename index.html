<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easy Têxtil — Produtos</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/index.css">
</head>
<body>
<header class="topbar">
  <div><strong>Easy Têxtil</strong><span>Produtos cadastrados</span></div>
  <nav><a href="dashboard.html">Painel</a><button class="link-btn" onclick="logout()">Sair</button></nav>
</header>
<main class="container">
  <div class="page-head">
    <div><h1>Produtos</h1><p>Cadastre, pesquise e edite seus modelos.</p></div>
    <a class="button primary" href="produto.html">+ Novo produto</a>
  </div>
  <section class="toolbar">
    <input id="buscador" type="search" placeholder="Buscar por nome da peça...">
    <div class="toolbar-actions">
      <button class="button" onclick="exportarJSON()">Exportar JSON</button>
      <button class="button" onclick="document.getElementById('arquivoJSON').click()">Importar JSON</button>
      <input id="arquivoJSON" type="file" accept=".json,application/json" hidden>
    </div>
  </section>
  <section id="listaProdutos" class="product-grid"></section>
</main>
<script src="js/app.js"></script>
<script src="js/index.js"></script>
</body>
</html>
